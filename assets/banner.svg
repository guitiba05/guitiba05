<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e14"/>
      <stop offset="50%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a371f7"/>
      <stop offset="50%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
    <linearGradient id="glowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a371f7;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262d" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="900" height="200" fill="url(#bg)" rx="10"/>
  <rect width="900" height="200" fill="url(#grid)" rx="10"/>
  <rect x="0" y="0" width="900" height="3" fill="url(#accent)" opacity="0.9"/>

  <!-- Decorative dots -->
  <circle cx="60" cy="30" r="2" fill="#a371f7" opacity="0.5"/>
  <circle cx="840" cy="40" r="2.5" fill="#58a6ff" opacity="0.4"/>
  <circle cx="780" cy="170" r="2" fill="#3fb950" opacity="0.3"/>
  <circle cx="120" cy="170" r="1.5" fill="#a371f7" opacity="0.3"/>
  <ellipse cx="400" cy="100" rx="250" ry="80" fill="url(#glowBg)"/>

  <!-- Avatar circle -->
  <circle cx="80" cy="95" r="35" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="74" y="105" font-family="monospace" font-size="26" fill="#58a6ff">&gt;_</text>

  <!-- Terminal line -->
  <text x="130" y="48" font-family="monospace" font-size="12" fill="#8b949e">
    <tspan fill="#3fb950">guitiba05</tspan><tspan fill="#8b949e">@github:~$</tspan> cat profile.md
  </text>

  <!-- Name -->
  <text x="130" y="80" font-family="sans-serif" font-size="28" font-weight="bold" fill="#e6edf3">
    Guilherme Eidi Tiba
  </text>

  <!-- Title line -->
  <text x="130" y="105" font-family="sans-serif" font-size="14" fill="#a371f7">
    Computer Engineering Student  |  Dev Intern @ Metagal
  </text>

  <!-- Skills line -->
  <text x="130" y="130" font-family="monospace" font-size="12" fill="#8b949e">
    <tspan fill="#ff7b72">import</tspan> { Python, Java, C#, SQL, TypeScript }
  </text>

  <!-- Location -->
  <text x="130" y="152" font-family="sans-serif" font-size="12" fill="#8b949e">
    Sao Paulo, Brazil  |  CEFSA  |  ETESP
  </text>

  <!-- Status badge -->
  <rect x="660" y="55" width="95" height="20" rx="4" fill="#21262d" stroke="#30363d" stroke-width="0.5"/>
  <text x="668" y="69" font-family="monospace" font-size="10" fill="#3fb950">system ready</text>

  <!-- Bottom divider -->
  <rect x="130" y="168" width="640" height="1" fill="url(#accent)" opacity="0.3"/>
  <text x="130" y="186" font-family="monospace" font-size="10" fill="#484f58">
    STATUS: learning  |  FOCUS: back-end &amp; automation  |  UPTIME: 24/7
  </text>

  <rect x="0" y="197" width="900" height="3" fill="url(#accent)" opacity="0.9"/>
</svg>
