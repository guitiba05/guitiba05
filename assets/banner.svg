<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle accent gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5" opacity="0.5"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="12"/>
  <rect width="900" height="200" fill="url(#grid)" rx="12"/>

  <!-- Decorative dots -->
  <circle cx="80" cy="40" r="2" fill="#58a6ff" opacity="0.3"/>
  <circle cx="820" cy="60" r="3" fill="#a371f7" opacity="0.3"/>
  <circle cx="750" cy="170" r="2" fill="#58a6ff" opacity="0.4"/>
  <circle cx="150" cy="160" r="1.5" fill="#a371f7" opacity="0.3"/>
  <circle cx="400" cy="30" r="1.5" fill="#58a6ff" opacity="0.2"/>

  <!-- Terminal-style prefix -->
  <text x="50" y="55" font-family="'Courier New', monospace" font-size="14" fill="#8b949e">
    $&gt; ./profile.sh
  </text>

  <!-- Main name -->
  <text x="50" y="95" font-family="'Segoe UI', -apple-system, sans-serif" font-size="36" font-weight="700" fill="#e6edf3">
    Guilherme Eidi Tiba
  </text>

  <!-- Title -->
  <text x="50" y="125" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18" fill="#58a6ff" filter="url(#glow)">
    Software Engineer
  </text>

  <!-- Tagline -->
  <text x="50" y="152" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" fill="#8b949e">
    Building digital experiences for the web ✦
  </text>

  <!-- Location badge -->
  <rect x="50" y="162" width="0" height="0" rx="4" fill="#21262d"/>
  <text x="50" y="178" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" fill="#8b949e">
    ▼ Delray Beach, FL
  </text>

  <!-- Code decorations (right side) -->
  <text x="620" y="55" font-family="'Courier New', monospace" font-size="11" fill="#21262d" opacity="0.6">
    <tspan x="620" dy="0">┌─────────────────────┐</tspan>
    <tspan x="622" dy="16">│  status: active      │</tspan>
    <tspan x="622" dy="16">│  focus: web dev      │</tspan>
    <tspan x="622" dy="16">│  uptime: ∞           │</tspan>
    <tspan x="620" dy="16">└─────────────────────┘</tspan>
  </text>

  <!-- Terminal cursor blink (animated) -->
  <rect x="165" y="80" width="12" height="2" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Gradient line separator -->
  <line x1="50" y1="165" x2="400" y2="165" stroke="url(#accent)" stroke-width="1" opacity="0.5"/>

  <!-- Bottom-right accent bar -->
  <rect x="0" y="195" width="900" height="5" fill="url(#accent)" rx="0" opacity="0.8"/>
</svg>
